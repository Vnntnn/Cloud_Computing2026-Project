name: ci

# Checks only — lint, typecheck, test, verify the build compiles, and an
# end-to-end persona smoke against the four services. NO AWS / EKS interaction:
# deploy to EKS is a local script (scripts/deploy.sh), because GitHub Actions
# cannot assume a role in the Learner Lab account (no OIDC provider, static creds
# expire in 4h — SYSTEM-DESIGN §9).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MASTER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      # The transaction / idempotency / check-in tests run against a real
      # Postgres — create the four service databases + roles first.
      - run: bun run --filter @eventide/db db:bootstrap
      - run: bunx turbo run lint check-types test build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run --filter @eventide/db db:bootstrap
      - name: start the four services
        run: |
          (cd apps/auth && PORT=3000 bun src/index.ts &)
          (cd apps/event && PORT=3001 bun src/index.ts &)
          (cd apps/registration && PORT=3002 bun src/index.ts &)
          (cd apps/payment && PORT=3003 bun src/index.ts &)
          for i in $(seq 1 30); do
            if curl -sf localhost:3000/health/ready >/dev/null \
              && curl -sf localhost:3001/health/ready >/dev/null \
              && curl -sf localhost:3002/health/ready >/dev/null \
              && curl -sf localhost:3003/health/ready >/dev/null; then
              echo "all four services ready"; exit 0
            fi
            sleep 1
          done
          echo "services did not become ready"; exit 1
      - run: bun run --filter @eventide/db db:seed
      - run: bun scripts/smoke.ts

  # TODO: image build + push to ECR once we have a registry CI can reach.
  # Deploy stays local — see the header comment.
