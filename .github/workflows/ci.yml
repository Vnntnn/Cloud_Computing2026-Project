name: ci

# check + images: tests against the compose stack, the web build, every image build
# (pull requests and main).
# deploy: on push to main (or run by hand), runs scripts/deploy.sh against the live
# EKS cluster. The Learner Lab has no OIDC federation, so the only way in is the
# session credentials stored as the AWS_* repository secrets by `make ci-creds`;
# they expire with the lab session (~4 h). The job therefore SKIPS, with a notice
# and no failure, when the secrets are missing/expired or the platform is down
# (`make down`) — it never clobbers a working cluster with stale credentials.
# It only deploys; `make up` / `make down` (terraform apply) stay manual, for cost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Every workspace reads the ROOT .env (--env-file=../../.env).
      - name: .env for the compose stack
        run: |
          cp .env.example .env
          sed -i 's/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=ci-only-insecure-secret-0123456789abcdef/' .env
      - name: start postgres / redis / elasticmq / minio
        run: |
          docker compose up -d
          until docker compose exec -T postgres pg_isready -U postgres; do sleep 1; done
          docker compose wait minio-init || true
      - run: bun install --frozen-lockfile
      - run: bash scripts/lib.test.sh
      - name: the demo data (slugs, dates, ticket rules) is valid
        run: bun test demo/
      - run: bash scripts/release.test.sh
      - run: bash scripts/scan-secrets.test.sh
      - name: no credential-shaped string in a file git would share (prints where, never what)
        run: bash scripts/scan-secrets.sh
      # the session scripts, against stand-ins for aws / terraform / Cloudflare (no AWS, no network)
      - name: test the session scripts (state recovery, teardown, DNS delegation)
        run: |
          bash scripts/recover-state.test.sh
          bash scripts/teardown.test.sh
          bash scripts/delegate-dns.test.sh
      - run: bun run db:migrate
      - name: test the packages and services that have a test script
        run: |
          for p in packages/auth-guard packages/storage packages/mail apps/auth apps/event apps/registration apps/payment apps/mail-worker; do
            echo "== $p =="
            (cd "$p" && bun run test) || exit 1
          done
      - name: typecheck + build the web
        run: cd apps/web && bun check && bun run build

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [auth, event, registration, payment, mail-worker, web, db-bootstrap]
    steps:
      - uses: actions/checkout@v4
      - name: docker build (no push — see the header)
        run: |
          case "${{ matrix.image }}" in
            db-bootstrap) f=packages/db/Dockerfile ;;
            *) f="apps/${{ matrix.image }}/Dockerfile" ;;
          esac
          docker build -f "$f" -t "eventide/${{ matrix.image }}:ci" .

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-eks
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: AWS reachable and platform up?
        id: gate
        run: |
          set -u
          if [ -z "$AWS_ACCESS_KEY_ID" ] || ! ACCOUNT="$(aws sts get-caller-identity --query Account --output text 2>/dev/null)"; then
            echo "::notice title=deploy skipped::AWS credentials are missing or expired — run \`make ci-creds DEPLOY=1\` after Start Lab"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          terraform -chdir=infra/terraform init -input=false -backend-config="bucket=eventide-tfstate-${ACCOUNT}" >/dev/null
          if [ -z "$(terraform -chdir=infra/terraform output -raw nlb_dns_name 2>/dev/null)" ]; then
            echo "::notice title=deploy skipped::the platform is down (make down) — run \`make up\` first"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: deploy (build, push, secrets, helm — migrations run first)
        if: steps.gate.outputs.ok == 'true'
        run: bash scripts/deploy.sh
      - name: smoke
        if: steps.gate.outputs.ok == 'true'
        run: |
          NLB="$(terraform -chdir=infra/terraform output -raw nlb_dns_name)"
          for p in auth events regis payment; do
            curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "http://$NLB/api/$p/health" >/dev/null && echo "ok $p"
          done
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "http://$NLB/api/events/og/site" -o /dev/null -w "og/site %{http_code} %{content_type}\n"
