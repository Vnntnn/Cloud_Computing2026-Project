<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.ico for browsers without SVG icons; sizes keeps the rest on the SVG -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- theme and language before first paint (lib/theme.ts and i18n/index.ts keep them current) -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
        if (localStorage.getItem("locale") === "en") document.documentElement.lang = "en";
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title, description and Open Graph tags of each URL: server/head.ts fills this block -->
    <!--head--><title>Eventide</title><!--/head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
