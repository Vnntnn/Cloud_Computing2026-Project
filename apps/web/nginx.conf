server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA — every unknown path falls back to index.html so client-side routing
  # (/events/:id, /login, /tickets) works on a hard refresh. /api/* never
  # reaches this pod — the ingress routes those to the services.
  location / {
    try_files $uri /index.html;
  }

  # Hashed asset filenames — safe to cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
