# EKS overlay — `helm ... -f values.yaml -f values.aws.yaml
#   --set imageRegistry=$(terraform -chdir=infra/terraform/10-foundation output -raw ecr_registry)
#   --set publicUrl=https://<domain> --set files.bucket=<uploads bucket>`
# (scripts/deploy.sh passes all three.)
#
# ESO stays OFF on EKS: IRSA is unavailable (no iam:CreateOpenIDConnectProvider)
# and the node role can't read Secrets Manager (iam:AttachRolePolicy denied), so
# an ExternalSecret would need a static-credential secretRef that expires every
# session — no better than deploy.sh doing `kubectl create secret` from
# eventide/rds-master + Secrets Manager, which is what it does. See SYSTEM-DESIGN §5.2.1.
eso:
  enabled: false

# /files/<key> -> https://s3.us-east-1.amazonaws.com/<bucket>/<key> (path-style; the
# bucket policy in 10-foundation/s3.tf makes public/* readable).
files:
  host: s3.us-east-1.amazonaws.com
  port: 443
  protocol: HTTPS
  bucket: SET-BY-DEPLOY-SH

defaults:
  replicas: 2

# Redis is ElastiCache here (TLS + AUTH): REDIS_URL comes from the eventide-common Secret
# (deploy.sh), so the static in-cluster URL and the redis pod are dropped.
commonEnv:
  REDIS_URL: null

dbMigrate:
  urlKey: DATABASE_MIGRATE_URL

# Node tiers (infra/terraform/modules/platform/eks.tf): `edge` nodes have no route to the
# internet, `egress` nodes go out through the NAT gateway. Only the services that call
# Google, Stripe or Gmail need the second.
services:
  auth:
    nodeSelector: { eventide/tier: egress }
  payment:
    nodeSelector: { eventide/tier: egress }
  mail-worker:
    nodeSelector: { eventide/tier: egress }
  registration:
    nodeSelector: { eventide/tier: edge }
  web:
    nodeSelector: { eventide/tier: edge }
  redis: null
  event:
    nodeSelector: { eventide/tier: edge }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 60
