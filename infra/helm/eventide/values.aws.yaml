# EKS overlay — `helm ... -f values.yaml -f values.aws.yaml
#   --set imageRegistry=$(terraform -chdir=infra/terraform/10-foundation output -raw ecr_registry)
#   --set publicUrl=https://<domain>`
#
# ESO fills the eventide-<svc> Secrets from Secrets Manager; the NLB (Terraform)
# forwards :80 to ingress-nginx's NodePort, so no host is pinned here until the
# custom domain lands.

eso:
  enabled: true
  createClusterSecretStore: true
  region: us-east-1
  serviceAccount: ""
  # deploy.sh creates this Secret from `aws configure export-credentials` each
  # run (session creds — the only principal with secretsmanager access; the node
  # role has none and iam:AttachRolePolicy is denied, §5.3). Expires with the
  # 4 h session; a redeploy refreshes it.
  authSecretName: eventide-aws-creds
  # Fast enough that the "rotate a secret, watch it sync" demo (DEMO-RUNSHEET §5)
  # doesn't need a manual force-sync. ~3 GetSecretValue calls/min ≈ $0.001/day.
  refreshInterval: 1m

defaults:
  replicas: 2

services:
  event:
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilizationPercentage: 60
