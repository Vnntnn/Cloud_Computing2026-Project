{{- if .Values.eso.enabled }}
{{- $root := . -}}
{{- if .Values.eso.createClusterSecretStore }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.eso.storeName }}
  labels:
    app.kubernetes.io/part-of: eventide
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.eso.region }}
      {{- if .Values.eso.authSecretName }}
      # Static session credentials (AWS_* keys), refreshed each deploy by
      # scripts/deploy.sh. The lab node role can't read Secrets Manager and
      # iam:AttachRolePolicy is denied, so IMDS auth is not usable here (§5.3).
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.eso.authSecretName }}
            namespace: {{ .Values.namespace }}
            key: AWS_ACCESS_KEY_ID
          secretAccessKeySecretRef:
            name: {{ .Values.eso.authSecretName }}
            namespace: {{ .Values.namespace }}
            key: AWS_SECRET_ACCESS_KEY
          sessionTokenSecretRef:
            name: {{ .Values.eso.authSecretName }}
            namespace: {{ .Values.namespace }}
            key: AWS_SESSION_TOKEN
      {{- else if .Values.eso.serviceAccount }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.eso.serviceAccount }}
            namespace: {{ .Values.namespace }}
      {{- end }}
      # No auth override → default AWS credential chain (node role via IMDS).
{{- end }}
{{- range $k8sName, $smName := .Values.eso.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $k8sName }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: eventide
spec:
  refreshInterval: {{ $root.Values.eso.refreshInterval }}
  secretStoreRef:
    name: {{ $root.Values.eso.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $k8sName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $smName }}
{{- end }}
{{- end }}
