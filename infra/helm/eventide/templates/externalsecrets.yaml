{{- if .Values.eso.enabled }}
{{- $root := . -}}
{{- if .Values.eso.createClusterSecretStore }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.eso.storeName }}
  labels:
    app.kubernetes.io/part-of: eventide
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.eso.region }}
      {{- if .Values.eso.serviceAccount }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.eso.serviceAccount }}
            namespace: {{ .Values.namespace }}
      {{- end }}
      # No `auth` block → the External Secrets controller uses the default AWS
      # credential chain, i.e. the node instance role via IMDS. IRSA is
      # unavailable in the lab (SYSTEM-DESIGN §5.3).
{{- end }}
{{- range $k8sName, $smName := .Values.eso.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $k8sName }}
  namespace: {{ $root.Values.namespace }}
  labels:
    app.kubernetes.io/part-of: eventide
spec:
  refreshInterval: {{ $root.Values.eso.refreshInterval }}
  secretStoreRef:
    name: {{ $root.Values.eso.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $k8sName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $smName }}
{{- end }}
{{- end }}
