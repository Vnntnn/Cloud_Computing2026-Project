{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- $uid := $svc.runAsUser | default $root.Values.defaults.runAsUser }}
{{/* `| default` treats false as empty — pick the bool explicitly. */}}
{{- $roRootFs := $root.Values.defaults.readOnlyRootFs }}
{{- if hasKey $svc "readOnlyRootFs" }}{{ $roRootFs = $svc.readOnlyRootFs }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.namespace }}
  labels:
    {{- include "eventide.labels" (dict "name" $name "root" $root) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default $root.Values.defaults.replicas }}
  {{- if $svc.strategy }}
  strategy:
    {{- toYaml $svc.strategy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "eventide.labels" (dict "name" $name "root" $root) | nindent 8 }}
    spec:
      {{- if $svc.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      {{- end }}
      # Spread across nodes so one node loss can't take a whole service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $uid }}
        fsGroup: {{ $uid }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ include "eventide.image" (dict "svc" $svc "root" $root) }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          {{- if $svc.args }}
          args: {{ toJson $svc.args }}
          {{- end }}
          {{- if $svc.port }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
          {{- end }}
          env:
            {{- if $svc.port }}
            - { name: PORT, value: {{ $svc.port | quote }} }
            {{- end }}
            - { name: NODE_ENV, value: {{ $root.Values.nodeEnv | quote }} }
            {{- if not $svc.noCommonEnv }}
            {{- range $k, $v := $root.Values.commonEnv }}
            - name: {{ $k }}
              value: {{ tpl $v $root | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ tpl $v $root | quote }}
            {{- end }}
          {{- if or (not $svc.noCommonEnv) $svc.secretName }}
          # Secrets: the common one (DATABASE_URL, S3_*, AWS_*, MAIL_QUEUE_URL) plus the
          # service's own — scripts/deploy.sh creates them on EKS, k3d-up.sh on k3d (or
          # ESO when eso.enabled). The app only ever reads process.env (SYSTEM-DESIGN §5.2).
          envFrom:
            {{- if not $svc.noCommonEnv }}
            - secretRef:
                name: {{ $root.Values.commonSecretName }}
            {{- end }}
            {{- if $svc.secretName }}
            - secretRef:
                name: {{ $svc.secretName }}
            {{- end }}
          {{- end }}
          {{- if $svc.port }}
          {{- if $svc.tcpProbe }}
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- else }}
          # Probes never touch the DB (CLAUDE.md hard rule): every v2 service answers
          # GET /api/<prefix>/health without I/O; `web` (static nginx) uses `/`.
          livenessProbe:
            httpGet: { path: {{ $svc.livePath | default "/health/live" }}, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: {{ $svc.readyPath | default "/health/ready" }}, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml ($svc.resources | default $root.Values.defaults.resources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $roRootFs }}
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
